<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>個別カルテ画面</title>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
  
  <style>
    /* （共通のデザイン変数は省略せず記載） */
    :root { --primary: #6b8c74; --primary-hover: #56735e; --bg-color: #f5f7f5; --card-bg: #ffffff; --text-main: #333a35; --text-light: #7b857e; --border: #dce3df; --accent: #d4a373; }
    body { font-family: 'Zen Kaku Gothic New', sans-serif; padding: 24px 16px; background-color: var(--bg-color); color: var(--text-main); line-height: 1.6; margin: 0; }
    .container { max-width: 800px; margin: 0 auto; }
    
    .card { background: var(--card-bg); padding: 32px; border-radius: 20px; box-shadow: 0 8px 30px rgba(107, 140, 116, 0.08); margin-bottom: 24px; border: 1px solid rgba(255,255,255,0.5); }
    .card h1 { font-size: 24px; color: var(--primary); text-align: center; margin: 0 0 24px 0; font-weight: 700; }
    .card h2 { font-size: 20px; color: var(--text-main); margin: 0 0 24px 0; display: flex; align-items: center; }
    .card h2::before { content: ''; display: inline-block; width: 4px; height: 20px; background: var(--primary); border-radius: 2px; margin-right: 12px; }
    
    .section-title { font-size: 1.1rem; color: var(--primary); border-bottom: 2px solid #ebf0ee; padding-bottom: 8px; margin: 32px 0 16px 0; font-weight: 700; }
    .form-group { margin-bottom: 20px; }
    .form-row { display: flex; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
    .form-row .form-group { flex: 1; min-width: 200px; margin-bottom: 0; }
    
    label { display: block; margin-bottom: 8px; font-weight: 500; font-size: 0.95em; color: var(--text-light); }
    input[type="text"], input[type="date"], input[type="number"], textarea { width: 100%; padding: 14px 16px; border: 1px solid var(--border); border-radius: 12px; box-sizing: border-box; font-size: 16px; background-color: #fbfcfb; color: var(--text-main); font-family: inherit; }
    textarea { height: 100px; resize: vertical; }

    /* アコーディオン開閉バーのスタイル */
    .accordion-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 16px 20px; background: #eef2ef; border-radius: 12px;
      cursor: pointer; font-weight: 700; color: var(--primary);
      transition: background 0.2s; border: 1px solid var(--border);
    }
    .accordion-header:hover { background: #e2e8e4; }
    .accordion-icon { font-size: 12px; transition: transform 0.3s; }
    
    /* 中身のコンテンツ（初期状態は非表示） */
    .accordion-content { display: none; margin-top: 16px; padding: 0 8px; }
    .accordion-content.active { display: block; animation: fadeIn 0.4s ease-out forwards; }
    
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

    .btn { padding: 16px; font-size: 16px; font-weight: 700; border: none; border-radius: 12px; cursor: pointer; display: block; width: 100%; text-align: center; transition: 0.3s; }
    .btn-save-master { background-color: var(--text-main); color: white; margin-top: 32px; }
    .btn-save-master:hover { background-color: #1a1e1b; transform: translateY(-2px); }
    .btn-add-record { background-color: var(--primary); color: white; margin-top: 16px; }
    
    /* 履歴リスト簡易版 */
    .record-item { background: #fafbfc; border: 1px solid var(--border); padding: 20px; border-radius: 12px; margin-bottom: 16px; }
    .record-date { display: inline-block; background: var(--primary); color: white; padding: 4px 12px; border-radius: 20px; font-size: 0.85em; font-weight: 700; margin-bottom: 12px; }
  </style>
</head>
<body>

<div class="container">
  
  <!-- 上部：カルテ基本情報（アコーディオンで開閉） -->
  <div class="card">
    <h1>山田 花子 様 のカルテ</h1>
    
    <!-- 開閉ボタン -->
    <div class="accordion-header" onclick="toggleCustomerInfo()">
      <span>▼ お客様情報・カウンセリングシートを開く</span>
      <span class="accordion-icon" id="accordion-icon">＋</span>
    </div>

    <!-- アコーディオンの中身（開いた時だけ表示） -->
    <div class="accordion-content" id="customer-info-content">
      
      <div class="section-title">基本情報</div>
      <div class="form-row">
        <div class="form-group"><label>生年月日</label><input type="date" id="dob"></div>
        <div class="form-group"><label>電話番号</label><input type="text" id="phone"></div>
      </div>

      <div class="section-title">ご来店について</div>
      <div class="form-group">
        <label>来店目的・整えたいこと（抜粋）</label>
        <textarea placeholder="例：姿勢改善、疲れないカラダ..."></textarea>
      </div>

      <div class="section-title">理想について</div>
      <div class="form-group">
        <label>どんなスタイル・顔が好きですか?</label>
        <textarea placeholder="自由にご記入ください"></textarea>
      </div>

      <!-- 今回追加した備考欄 -->
      <div class="section-title">備考欄</div>
      <div class="form-group">
        <label>その他・特記事項</label>
        <textarea placeholder="スタッフ間の共有事項や、カウンセリングシート外の情報を記入します" style="height: 120px;"></textarea>
      </div>
      
      <button class="btn btn-save-master">基本情報を保存・更新する</button>
    </div>
  </div>

  <!-- 下部：お稽古記録（常に表示されているので、すぐに入力・閲覧可能） -->
  <div class="card">
    <h2>お稽古記録</h2>
    
    <!-- 追加ボタン（ここを押すと前回のようにお稽古内容やファイル添付が開きます） -->
    <button class="btn btn-add-record" onclick="alert('本日のお稽古入力フォームが開きます（前回のコードと同じ動作です）')">
      ＋ 本日のお稽古記録を追加
    </button>

    <div style="margin-top: 32px;">
      <div class="record-item">
        <div class="record-date">2026.09.20</div>
        <div>骨盤の歪み調整、肩甲骨周りのリリース。右肩の力みグセあり。自宅でのストレッチを指導。<br>施術前後の姿勢を撮影しました。</div>
      </div>
      <div class="record-item">
        <div class="record-date">2026.08.15</div>
        <div>初回カウンセリング。全体的な姿勢チェックと呼吸法の指導。</div>
      </div>
    </div>
  </div>

</div>

<script>
  // お客様情報アコーディオンの開閉処理
  function toggleCustomerInfo() {
    const content = document.getElementById('customer-info-content');
    const icon = document.getElementById('accordion-icon');
    
    if (content.classList.contains('active')) {
      // 閉じる
      content.classList.remove('active');
      icon.innerText = '＋';
    } else {
      // 開く
      content.classList.add('active');
      icon.innerText = '－';
    }
  }
</script>

</body>
</html>
