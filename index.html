<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>體調律研究所 - 管理ダッシュボード</title>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #6b8c74; --primary-hover: #56735e; --bg-color: #f5f7f5;
      --card-bg: #ffffff; --text-main: #333a35; --text-light: #7b857e;
      --border: #dce3df; --accent: #d4a373;
    }
    body { font-family: 'Zen Kaku Gothic New', sans-serif; padding: 24px 16px; background-color: var(--bg-color); color: var(--text-main); line-height: 1.6; margin: 0; }
    .container { max-width: 900px; margin: 0 auto; }
    
    h1 { font-size: 24px; color: var(--primary); text-align: center; margin-bottom: 32px; font-weight: 700; letter-spacing: 0.05em; }
    .card { background: var(--card-bg); padding: 32px; border-radius: 20px; box-shadow: 0 8px 30px rgba(107, 140, 116, 0.08); margin-bottom: 24px; border: 1px solid rgba(255,255,255,0.5); }
    .card-title { font-size: 18px; font-weight: 700; margin-bottom: 20px; display: flex; align-items: center; }
    .card-title::before { content: ''; display: inline-block; width: 4px; height: 18px; background: var(--primary); border-radius: 2px; margin-right: 12px; }

    /* ダッシュボード（売上・利用数） */
    .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; }
    .stat-box { background: #fafbfc; border: 1px solid var(--border); padding: 20px; border-radius: 12px; text-align: center; }
    .stat-title { font-size: 0.9em; color: var(--text-light); font-weight: 500; margin-bottom: 8px; }
    .stat-value { font-size: 28px; font-weight: 700; color: var(--primary); }
    .stat-value.accent { color: var(--accent); }
    .date-filter { display: flex; gap: 8px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
    input[type="date"], input[type="text"] { padding: 10px 16px; border: 1px solid var(--border); border-radius: 8px; font-size: 15px; font-family: inherit; color: var(--text-main); }
    
    /* 検索バー */
    .search-wrapper { display: flex; gap: 12px; }
    .search-input { flex: 1; padding: 14px 16px; border: 2px solid var(--border); border-radius: 12px; font-size: 16px; transition: 0.3s; }
    .search-input:focus { border-color: var(--primary); outline: none; }
    
    /* アクションボタン（新規登録・プラン） */
    .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .btn { padding: 16px; font-size: 16px; font-weight: 700; border: none; border-radius: 12px; cursor: pointer; text-align: center; transition: 0.3s; }
    .btn-primary { background-color: var(--primary); color: white; box-shadow: 0 4px 12px rgba(107, 140, 116, 0.2); }
    .btn-primary:hover { background-color: var(--primary-hover); transform: translateY(-2px); }
    .btn-secondary { background-color: var(--text-main); color: white; }
    .btn-secondary:hover { background-color: #1a1e1b; transform: translateY(-2px); }

    @media (max-width: 600px) { .action-grid { grid-template-columns: 1fr; } .search-wrapper { flex-direction: column; } }
  </style>
</head>
<body>

<div class="container">
  <h1>體調律研究所システム</h1>

  <!-- 売上・利用数ダッシュボード -->
  <div class="card">
    <div class="card-title">利用数・売上レポート</div>
    <div class="date-filter">
      <input type="date" value="2026-09-01"> 〜 <input type="date" value="2026-09-30">
      <button class="btn btn-secondary" style="padding: 10px 16px; font-size: 14px;">集計する</button>
    </div>
    <div class="dashboard-grid">
      <div class="stat-box">
        <div class="stat-title">指定期間の来店数</div>
        <div class="stat-value">42 <span style="font-size: 14px; color: var(--text-light);">名</span></div>
      </div>
      <div class="stat-box">
        <div class="stat-title">指定期間の新規登録</div>
        <div class="stat-value">5 <span style="font-size: 14px; color: var(--text-light);">名</span></div>
      </div>
      <div class="stat-box">
        <div class="stat-title">指定期間の売上合計</div>
        <div class="stat-value accent">¥345,000</div>
      </div>
    </div>
  </div>

  <!-- 患者検索 -->
  <div class="card">
    <div class="card-title">お客様検索</div>
    <div class="search-wrapper">
      <input type="text" class="search-input" placeholder="名前・フリガナ・電話番号で検索...">
      <button class="btn btn-primary" style="white-space: nowrap; margin: 0;" onclick="alert('検索結果一覧画面へ遷移します')">検索する</button>
    </div>
  </div>

  <!-- クイックアクション -->
  <div class="action-grid">
    <button class="btn btn-primary" onclick="alert('新規登録画面（空のカルテ画面）へ遷移します')">
      ＋ 新規お客様登録
    </button>
    <button class="btn btn-secondary" onclick="alert('プラン一覧・料金設定の管理画面へ遷移します')">
      📋 プラン説明・管理
    </button>
  </div>

</div>

</body>
</html>
